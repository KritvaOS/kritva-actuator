name: docs-checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Documentation headers and revision history
        run: make check-docs
      - name: Relative links
        run: make check-links
      - name: Requirements traceability
        run: make check-trace
      - name: BOM schema
        run: make check-bom
      - name: Calculation regression and document consistency
        run: make check-calcs
      - name: Migration manifest
        run: make check-manifest
      - name: Submodule layout
        run: make check-submodules
      # After migration Stage 5, enable recursive checkout of the private child
      # repositories (deploy key per child or a scoped GitHub App token; the
      # default GITHUB_TOKEN cannot read other private repositories):
      #   - uses: actions/checkout@v4
      #     with:
      #       submodules: recursive
      #       ssh-key: ${{ secrets.CHILD_REPOS_DEPLOY_KEY }}
