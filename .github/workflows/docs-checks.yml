name: docs-checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # The four child repositories are submodules. While they are public the default
      # token is enough. Once they are private, create a fine-grained personal access
      # token (or GitHub App token) with read-only "Contents" access to the four
      # child repositories and store it as the secret CHILD_REPOS_TOKEN.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.CHILD_REPOS_TOKEN || github.token }}
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Submodule layout (all four required)
        run: python3 scripts/integration/check_submodules.py --root . --require
      - name: Documentation headers and revision history
        run: make check-docs
      - name: Relative links
        run: make check-links
      - name: Requirements traceability
        run: make check-trace
      - name: BOM schema
        run: make check-bom
      - name: Calculation regression and document consistency
        run: make check-calcs
      - name: Migration manifest
        run: make check-manifest
